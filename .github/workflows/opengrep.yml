name: opengrep

# Static site, no build: a bad commit is live ~60s after merge, so the scan runs
# before that. ERROR-severity findings fail the job; WARNING findings are
# informational (the audit rules have a known, accepted baseline).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the job only reads the tree. `pull_request` (never
# `pull_request_target`) means fork PRs get a read-only token and no secrets;
# the scan still runs PR-controlled code, so nothing writable may be in scope.
permissions:
  contents: read

# Superseded pushes to the same PR/branch do not need their own scan.
concurrency:
  group: opengrep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENGREP_VERSION: "1.33.1"
  # sha256 of opengrep_manylinux_x86 for v1.33.1 — verified 2026-11-08
  OPENGREP_SHA256: "46e8133cc490f9f50518061590ce2f6be5a08afaeda034471c0ceda4b3899808"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a full commit SHA (OWASP GitHub Actions Security Cheat Sheet L157):
      # a mutable tag can be repointed to run arbitrary code in this job.
      # persist-credentials: false keeps the job token out of .git/config so the
      # PR-controlled steps cannot reuse it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install opengrep (pinned + checksum)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          url="https://github.com/opengrep/opengrep/releases/download/v${OPENGREP_VERSION}/opengrep_manylinux_x86"
          curl -sSfL -o "$RUNNER_TEMP/bin/opengrep" "$url"
          echo "${OPENGREP_SHA256}  $RUNNER_TEMP/bin/opengrep" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/opengrep"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/opengrep" --version

      - name: Scan (fail on ERROR)
        run: bash scripts/scan.sh --severity ERROR --error --json -o "$RUNNER_TEMP/opengrep.json"

      - name: Scan (full report)
        if: always()
        run: bash scripts/scan.sh --json -o "$RUNNER_TEMP/opengrep-all.json"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opengrep-results
          path: ${{ runner.temp }}/opengrep*.json
          if-no-files-found: warn
